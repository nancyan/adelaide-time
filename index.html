<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09111f" />
    <meta
      name="description"
      content="The current local time and date in Adelaide, South Australia."
    />
    <title>Time in Adelaide</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="clock-card" aria-labelledby="page-title">
      <div class="location-row">
        <span class="live-dot" aria-hidden="true"></span>
        <span>South Australia</span>
      </div>

      <h1 id="page-title">Adelaide</h1>

      <time id="clock" class="clock" aria-live="off">--:--:--</time>
      <p id="date" class="date">Loading local date…</p>

      <div class="timezone-row">
        <span id="timezone">Australia/Adelaide</span>
        <span aria-hidden="true">·</span>
        <span id="offset">UTC offset</span>
      </div>
    </main>
  </body>
</html>
